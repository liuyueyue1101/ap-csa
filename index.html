<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AP CSA Foundations</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body class="workspace-body">
<div class="workspace">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <a class="course-mark" href="index.html">
        <span class="course-mark-title">AP CSA Foundations</span>
        <span class="course-mark-sub">May 12, 2027</span>
      </a>
      <label class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="navSearch" placeholder="Find a lesson" autocomplete="off"/>
      </label>
    </div>
    <nav id="courseNav" class="course-nav" aria-label="Course navigation"></nav>
    <div class="student-setting">
      <label for="studentNameInput">Student name</label>
      <input id="studentNameInput" placeholder="Student" autocomplete="off"/>
    </div>
    <div class="sidebar-bottom sidebar-bottom-stacked">
      <a href="tracker.html">Progress tracker</a>
      <a href="teaching.html">Teaching guide</a>
      <button id="showResources" class="text-button">Resources</button>
    </div>
  </aside>

  <button class="mobile-menu" id="mobileMenu" aria-label="Open course navigation">☰</button>

  <main class="workspace-main">
    <header class="workspace-header">
      <div>
        <p class="eyebrow" id="todayLabel">COURSE</p>
        <h1 id="currentTitle">Continue learning</h1>
      </div>
      <div class="header-progress">
        <span id="progressText">0 / 0 completed</span>
        <div class="progress-track"><span id="progressFill"></span></div>
      </div>
    </header>

    <section class="continue-panel" id="continuePanel"></section>

    <section class="week-panel">
      <div class="section-heading">
        <div>
          <p class="eyebrow">CURRENT WEEK</p>
          <h2 id="weekTitle">Week</h2>
        </div>
        <button class="text-button" id="markReset">Reset progress</button>
      </div>
      <div id="currentWeekList" class="lesson-list"></div>
    </section>

    <section class="resources-drawer" id="resourcesDrawer" hidden>
      <div class="section-heading">
        <div>
          <p class="eyebrow">REFERENCE</p>
          <h2>Free resources</h2>
        </div>
        <button class="text-button" id="closeResources">Close</button>
      </div>
      <div id="resourcesList" class="plain-resource-list"></div>
    </section>
  </main>
</div>

<script src="data.js"></script><script src="data-1.js"></script><script src="data-2.js"></script><script src="data-3.js"></script><script src="data-4.js"></script><script src="data-5.js"></script><script src="data-6.js"></script><script src="data-7.js"></script><script src="data-8.js"></script><script src="data-9.js"></script><script src="data-10.js"></script><script src="app.js"></script>
</body>
</html>
