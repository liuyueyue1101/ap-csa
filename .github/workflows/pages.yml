name: Deploy AP CSA Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check lesson.js
          for f in data*.js; do node --check "$f"; done
          node --check practice-banks.js
      - name: Audit all lesson reveal states
        run: node scripts/lesson-quality-check.cjs
      - name: Test browser reveal states
        run: |
          node scripts/browser-quality-check.cjs u1-2
          node scripts/browser-quality-check.cjs u1-3
          node scripts/browser-quality-check.cjs u1-4
          node scripts/browser-quality-check.cjs u1-5
          node scripts/browser-quality-check.cjs u1-6
          node scripts/browser-quality-check.cjs u1-7
          node scripts/browser-quality-check.cjs u1-8
          node scripts/browser-quality-check.cjs u1-9
          node scripts/browser-quality-check.cjs p-1-7-1-9
          node scripts/browser-quality-check.cjs p-foundation-1
          node scripts/browser-quality-check.cjs p-foundation-2
          node scripts/browser-quality-check.cjs p-1-1-1-3
          node scripts/browser-quality-check.cjs p-1-4-1-6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
