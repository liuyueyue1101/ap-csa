<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Progress • Oscar AP CSA</title><link rel="stylesheet" href="styles.css"/></head>
<body>
<main class="tracker-page">
  <a class="tracker-back" href="index.html">← Course</a>
  <header class="tracker-header">
    <p class="eyebrow">PROGRESS TRACKER</p>
    <h1>Oscar AP CSA</h1>
    <div class="tracker-progress-line"><span id="trackerCount"></span><div class="progress-track"><span id="trackerFill"></span></div></div>
  </header>
  <div id="trackerWeeks"></div>
</main>
<script src="data.js"></script><script src="data-1.js"></script><script src="data-2.js"></script><script src="data-3.js"></script><script src="data-4.js"></script><script src="data-5.js"></script><script src="data-6.js"></script><script src="data-7.js"></script><script src="data-8.js"></script><script src="data-9.js"></script><script src="data-10.js"></script>
<script>
const D=COURSE_DATA,key='oscar-apcsa-progress';
const getDone=()=>new Set(JSON.parse(localStorage.getItem(key)||'[]'));
const save=s=>localStorage.setItem(key,JSON.stringify([...s]));
function render(){
 const done=getDone(),total=D.lessons.length;
 document.querySelector('#trackerCount').textContent=done.size+' of '+total+' sessions completed';
 document.querySelector('#trackerFill').style.width=Math.round(done.size/total*100)+'%';
 const root=document.querySelector('#trackerWeeks');root.innerHTML='';
 const max=Math.max(...D.lessons.map(x=>x.week));
 for(let w=1;w<=max;w++){
  const a=D.lessons.filter(x=>x.week===w);if(!a.length)continue;
  const sec=document.createElement('section');sec.className='tracker-week';
  sec.innerHTML='<div class="tracker-week-head"><div><p class="eyebrow">'+a[0].phase+'</p><h2>Week '+w+'</h2></div><span>'+a.filter(x=>done.has(x.id)).length+' / '+a.length+'</span></div><div class="lesson-list"></div>';
  const list=sec.querySelector('.lesson-list');
  a.forEach((x,idx)=>{
   const row=document.createElement('div');row.className='lesson-row '+(done.has(x.id)?'done':'');
   row.innerHTML='<button class="tracker-check" data-id="'+x.id+'">'+(done.has(x.id)?'✓':'○')+'</button><a class="row-main" href="lesson.html?id='+encodeURIComponent(x.id)+'"><b>'+x.title+'</b><small>'+x.sessionInWeek+' · '+x.apTopic+'</small></a><a class="row-arrow" href="lesson.html?id='+encodeURIComponent(x.id)+'">→</a>';
   list.appendChild(row);
  });
  root.appendChild(sec);
 }
 root.querySelectorAll('.tracker-check').forEach(b=>b.onclick=()=>{const d=getDone();d.has(b.dataset.id)?d.delete(b.dataset.id):d.add(b.dataset.id);save(d);render();});
}
render();
</script>
</body></html>
